services:
  postgres:
    image: postgres:16
    container_name: orgstack-postgres
    restart: unless-stopped
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: orgstack_db
      POSTGRES_USER: orgstack_user
      POSTGRES_PASSWORD: orgstack_pass
    volumes:
      - postgres_data:/var/lib/postgresql/data

  rabbitmq:
    image: rabbitmq:3-management
    container_name: orgstack-rabbitmq
    restart: unless-stopped
    ports:
      - "5672:5672"
      - "15672:15672"
    environment:
      RABBITMQ_DEFAULT_USER: orgstack_mq
      RABBITMQ_DEFAULT_PASS: orgstack_mq_pass
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq

volumes:
  postgres_data:
  rabbitmq_data:
